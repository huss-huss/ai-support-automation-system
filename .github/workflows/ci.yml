name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - run: ruff check .

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Eval harness smoke run (offline fake provider)
        run: python -m evals.run_eval
        env:
          LLM_PROVIDER: fake

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: support_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_user -d support_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://support_user:support_pass@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply, match the models, and round-trip
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests against Postgres
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest
