x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://support_user:support_pass@postgres:5432/support_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENVIRONMENT: development
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  API_KEYS: ${API_KEYS:?set API_KEYS (comma-separated) to protect the ticket endpoints}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # /metrics: with METRICS_TOKEN set, scrapes need "Authorization: Bearer <token>"
  # (what the monitoring profile's Prometheus sends); otherwise a read-scoped
  # X-API-Key. METRICS_PUBLIC=true drops auth; only do that on a private network.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  METRICS_PUBLIC: ${METRICS_PUBLIC:-false}

services:
  api:
    build: .
    container_name: support_api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: support_worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      <<: *app-env
      # Prefork pool children write metrics here; the main process merges them
      # and serves them on WORKER_METRICS_PORT. tmpfs: private to this
      # container and empty on every start, as multiprocess mode requires.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-metrics
      WORKER_METRICS_ADDR: 0.0.0.0
      WORKER_METRICS_PORT: "9101"
    tmpfs:
      - /tmp/prometheus-metrics
    # Reachable from Prometheus on the compose network only; not published.
    expose:
      - "9101"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: support_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: support_postgres
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: METRICS_TOKEN=$(openssl rand -hex 32) docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: support_prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - worker

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  postgres_data:
