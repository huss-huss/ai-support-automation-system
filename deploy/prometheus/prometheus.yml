# Scrapes the API and the Celery worker. Used by the "monitoring" profile in
# docker-compose.yml; both targets are only reachable on the compose network.
# The bearer token is METRICS_TOKEN, mounted as a compose secret.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: support-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: support-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["worker:9101"]
